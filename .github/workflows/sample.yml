name: main

on:
  push:
    branches:
      - test-action-361
  pull_request:

jobs:
  self-test-happy-path:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v5
      # uses: priya-kinthali/setup-python@sample-361
      # uses: actions/setup-python@main
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: |
          ${{ github.action_path }}/subdirectory/requirements-dev.txt
          ${{ github.action_path }}/requirements.txt
          ${{ github.action_path }}/requirements-test.txt

    
    - name: Install Dependencies
      shell: bash
      run: pip install -r ${{ github.action_path }}/requirements-test.txt

    - name: Python Version
      shell: bash
      run: python --version
          # requirements-dev.txt
          # requirements-test.txt
          #          requirements.txt