name: main

on:
  push:
    branches:
      - test-action-361
  pull_request:

jobs:
  self-test-happy-path:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      # uses: actions/setup-python@v5
      # uses: priya-kinthali/setup-python@sample-361-multi
      # uses: actions/setup-python@main

      uses: gowridurgad/setup-python@pip-install
      with:
            python-version:  '3.11'
            pip-install: -r requirements.txt
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          

    # - name: Install Dependencies
    #   shell: bash
    #   run: pip install -r requirements-sample.txt

    - name: Python Version
      shell: bash
      run: python --version
          # requirements-dev.txt
          # requirements-test.txt
          #          requirements.txt
          #           **/setup.cfg
          # **/requirements.txt
          # **/requirements-dev.txt