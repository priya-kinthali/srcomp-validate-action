name: SRComp Validate Action
description: A GitHub Action to validate a compstate.
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: priya-kinthali/setup-python@sample-361-multi
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: |
          ${{ github.action_path }}/subdirectory/requirements-dev.txt
          ${{ github.action_path }}/requirements-dev.txt
          ${{ github.action_path }}/requirements-test.txt

    
    - name: Install Dependencies
      shell: bash
      run: pip install -r ${{ github.action_path }}/requirements-test.txt

    - name: Python Version
      shell: bash
      run: python --version
