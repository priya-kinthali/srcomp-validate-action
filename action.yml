name: SRComp Validate Action
description: A GitHub Action to validate a compstate.
runs:
  using: composite
  steps:
    - name: Set up Python
      # uses: actions/setup-python@v5
      uses: priya-kinthali/setup-python@sample-361
      # uses: actions/setup-python@main
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: |
          ${{ github.action_path }}/requirements.txt
          ${{ github.action_path }}/requirements-dev.txt
          ${{ github.action_path }}/requirements-test.txt
        # cache-dependency-path: requirements.txt

    - name: Install Dependencies
      shell: bash
      run: pip install -r ${{ github.action_path }}/requirements.txt
      # run: pip install -r requirements.txt

    - name: Python Version
      shell: bash
      run: python --version
